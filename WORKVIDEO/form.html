<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="main">
        <section class="form-card">
            <div class="form-header">
                <span class="font">Wellcome TO Our Institute</span>
                <h1>Student Registration</h1>
            </div>
            <form id="RegistrationForm">
                <div class="fromgrid">
                    <div class="from-group">
                        <label for="FullName">FullName</label>
                        <input type="text" placeholder="Enter your FullName" name="fullname" id="FullName" required>
                    </div>
                    <div class="from-group">
                        <label for="Email">Email</label>
                        <input type="email" placeholder="Enter your Email" id="Email" required>
                    </div>
                    <div class="from-group">
                        <label for="Mobile Number">Mobile</label>
                        <input type="number" placeholder="Enter your 10-digit Mobile Number" id="Number" required>
                    </div>
                    <div class="from-group">
                        <label for="DOB">Date of birth</label>
                        <input type="date" id="date" name="date fo birth " required>
                    </div>
                    <div class="from-group">
                        <label for="gender">Gender</label>
                        <select name="gender" id="gender">
                            <option value="">select gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="other">other</option>
                        </select>
                    </div>
                    <div class="from-group">
                        <label for="Course">Select Course</label>
                        <select name="course" id="course" required>
                            <option value="">Choose your course</option>
                            <option value="Wed Development">Wed Development</option>
                            <option value="Python Programming">Python Programming</option>
                            <option value="Java Development">Java Development</option>
                            <option value="Data Science">Data Science</option>
                    
                        </select>
                    </div>
                    <div class="from-group">
                        <label for="address">Address</label>
                        <textarea name="address" id="address" row="3" placeholder="Enter your address" required></textarea>
                    </div>
                </div>
               <button type="submit" class="submit-btn">Submit Registration</button>
            </form>
        </section>
    </main>
</body>

</html>
