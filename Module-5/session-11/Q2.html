
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Review Card</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f4f4;
        }

        .movie-card {
            max-width: 450px;
            margin: 60px auto;
            border: none;
            border-radius: 15px;
            overflow: hidden;
        }

        .movie-poster {
            height: 220px;
            object-fit: cover;
        }

        .rating {
            background-color: #f84464;
            color: white;
            border-radius: 6px;
            padding: 6px 10px;
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="card movie-card shadow">

            <!-- Movie Image -->
            <img
                src="download.jfif"
                class="card-img-top movie-poster"
                alt="Movie poster"
            >

            <div class="card-body p-4">

                <!-- Movie Title -->
                <h2 class="fw-bold fs-3 mb-2">
                    The Dark Knight
                </h2>

                <!-- Movie Genre -->
                <p class="text-secondary small mb-3">
                    Action | Thriller | 2h 32m
                </p>

                <!-- Movie Rating -->
                <div class="d-flex align-items-center gap-2 mb-3">
                    <span class="rating fw-bold fs-5">
                        ★ 9.0/10
                    </span>
                    <span class="text-muted small">
                        User Rating
                    </span>
                </div>

                <hr>

                <!-- Review Heading -->
                <h5 class="fw-semibold fs-5">
                    Audience Review
                </h5>

                <!-- Review Text -->
                <p class="fw-normal fs-6 text-secondary lh-base">
                    An amazing movie with brilliant performances,
                    thrilling action, and a gripping storyline.
                    A must-watch for every movie lover!
                </p>

                <!-- Reviewer Details -->
                <p class="small text-muted mb-0">
                    Reviewed by Rahul • Movie Lover
                </p>

            </div>
        </div>

    </div>

</body>
</html>
