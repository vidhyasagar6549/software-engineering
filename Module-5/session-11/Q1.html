
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Style Product Cards</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-light">

    <div class="container mt-4">
        <h2 class="text-primary mb-4">Flipkart - Featured Products</h2>

        <div class="row">

            <!-- Card 1: Small Spacing -->
            <div class="col-md-4">
                <div class="card m-1 p-1 shadow-sm">
                    <img src="../session-6/6572457_sd.avif"
                         class="card-img-top"
                         alt="Headphones">

                    <div class="card-body">
                        <h5 class="card-title">Wireless Headphones</h5>
                        <p class="card-text">Comfortable headphones for everyday use.</p>
                        <h6 class="text-success">₹999</h6>
                    </div>
                </div>
            </div>

            <!-- Card 2: Medium Spacing -->
            <div class="col-md-4">
                <div class="card m-3 p-3 shadow-sm">
                    <img src="../session-7/smartwatch.webp"
                         class="card-img-top"
                         alt="Smartphone">

                    <div class="card-body">
                        <h5 class="card-title">Smartphone</h5>
                        <p class="card-text">A stylish phone for daily use.</p>
                        <h6 class="text-success">₹12,999</h6>
                    </div>
                </div>
            </div>

            <!-- Card 3: Large Spacing -->
            <div class="col-md-4">
                <div class="card m-4 p-4 shadow-sm">
                    <img src="../session-7/smartwatch.webp"
                         class="card-img-top"
                         alt="Smartwatch">

                    <div class="card-body">
                        <h5 class="card-title">Smartwatch</h5>
                        <p class="card-text">Track your activity in style.</p>
                        <h6 class="text-success">₹1,499</h6>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
