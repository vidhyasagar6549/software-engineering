
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Switcher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div id="mainContainer" class="container bg-light text-dark text-center p-5 mt-5 rounded shadow">
        <h1 class="fw-bold">Welcome to My Page</h1>
        <p class="fs-5">Switch between light and dark themes.</p>
        <button id="themeButton" class="btn btn-primary">Switch to Dark Mode</button>
    </div>

    <script>
        const container = document.getElementById("mainContainer");
        const button = document.getElementById("themeButton");

        button.addEventListener("click", function () {
            if (container.classList.contains("bg-light")) {
                container.classList.replace("bg-light", "bg-dark");
                container.classList.replace("text-dark", "text-light");
                button.textContent = "Switch to Light Mode";
                button.classList.replace("btn-primary", "btn-warning");
            } else {
                container.classList.replace("bg-dark", "bg-light");
                container.classList.replace("text-light", "text-dark");
                button.textContent = "Switch to Dark Mode";
                button.classList.replace("btn-warning", "btn-primary");
            }
        });
    </script>

</body>
</html>
