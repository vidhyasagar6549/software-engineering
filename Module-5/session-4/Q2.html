<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recreate a Zomato-style restaurant listing</title>
    <style>
        *{
            box-sizing: border-box;
        }
        body{
            display: flex;
            margin: 15px;
            font-family: Arial, Helvetica, sans-serif;
            background: #f8f8f8;
            color: #222;
        }
        article{
            margin: 5px;
            width: 320px;
            background-color: white;
            border-radius: 18px;
            overflow: hidden;
            margin-bottom: 25px;
            border: 1px solid #ddd;
            box-shadow: 0 2px 8px rgba( 0,0,0,0.08);
        }
            article img{
                width: 100%;
                height: 180px;
                object-fit: cover;
            }
            header{
                padding: 15px 20px 5px;
            }
            header h2{
                margin: 0;
            }
            .details{
                padding: 0 20px 15px;
                color:#666;
                font-size:  16px;
            }
            footer{
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 15px 20px;
                border-top: 1px solid #eee;
            }
            
footer span:last-child {
    background: #24963f;
    color: white;
    padding: 4px 7px;
    border-radius: 5px;
    font-weight: bold;
}

    </style>
</head>
<body>
    <article>
        <img src="OIP.webp"alt="manchurian">
        <header><h2>Manchurian</h2></header>
        <section class="details">
            <p>Pure veg Restaurant</p> 
            <p>RS 90</p>
        </section>
        <footer>
            <span>
                1.3km
            </span>
            <span>
                55-60 min
            </span>
            <span>
                4.0 *
            </span>
        </footer>
    </article>
    <article>
        <img src="OIP (1).webp" alt="Dosa">
        <header>
            <h2>
                Dosa
            </h2>
        </header>
       <section class="details">
            <p>Pure veg Restaurant</p> 
            <p>RS 100</p>
        </section>
        <footer>
            <span>
                1.7km
            </span>
            <span>
                65-75 min
            </span>
            <span>
                4.7 *
            </span>
        </footer>
    </article>
</body>
</html>
