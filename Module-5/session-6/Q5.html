
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Movie Poster Grid</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(3, 180px);
            gap: 20px;
            justify-content: center;
        }

        .movie-card {
            position: relative;
            background-color: white;
            border-radius: 8px;
            overflow: hidden;
        }

        .movie-poster {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }

        .movie-title {
            font-size: 16px;
        }

        .new-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: red;
            color: white;
            border-radius: 4px;
        }

        /* Reusable spacing class avoids repeating margin and padding.
           Updating these values in one place keeps the design consistent
           and makes future maintenance easier. */
        .spacing {
            margin: 10px;
            padding: 12px;
        }
    </style>
</head>
<body>

    <h2 class="spacing">Now Showing</h2>

    <div class="movie-grid">
        <div class="movie-card">
            <img
                class="movie-poster"
                src="https://placehold.co/180x250/333333/ffffff?text=Movie+1"
                alt="Movie 1 poster"
            >
            <span class="new-badge spacing">NEW</span>
            <p class="movie-title spacing">Movie One</p>
        </div>

        <div class="movie-card">
            <img
                class="movie-poster"
                src="https://placehold.co/180x250/124559/ffffff?text=Movie+2"
                alt="Movie 2 poster"
            >
            <p class="movie-title spacing">Movie Two</p>
        </div>

        <div class="movie-card">
            <img
                class="movie-poster"
                src="https://placehold.co/180x250/792e39/ffffff?text=Movie+3"
                alt="Movie 3 poster"
            >
            <p class="movie-title spacing">Movie Three</p>
        </div>
    </div>

</body>
</html>
