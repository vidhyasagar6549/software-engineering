
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Poster Grid</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
        }

        h2 {
            color: #333;
            text-align: center;
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            max-width: 900px;
            margin: 30px auto;
        }

        .movie-card {
            position: relative; /* Parent for the absolute badge */
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px #ccc;
        }

        .movie-poster {
            width: 100%;
            height: 270px;
            object-fit: cover;
            display: block;
        }

        .movie-title {
            font-size: 16px;
            font-weight: bold;
            padding: 12px;
            margin: 0;
        }

        .new-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: #e91e63;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .spacing {
            margin: 10px;
            padding: 12px;
        }
    </style>
</head>

<body>

    <h2>Now Showing</h2>

    <div class="movie-grid">

        <div class="movie-card">
            <img
                class="movie-poster"
                src="https://placehold.co/300x450/252044/ffffff?text=Movie+One"
                alt="Movie One poster"
            >
            <span class="new-badge">NEW</span>
            <p class="movie-title">Movie One</p>
        </div>

        <div class="movie-card">
            <img
                class="movie-poster"
                src="https://placehold.co/300x450/124559/ffffff?text=Movie+Two"
                alt="Movie Two poster"
            >
            <p class="movie-title">Movie Two</p>
        </div>

        <div class="movie-card">
            <img
                class="movie-poster"
                src="https://placehold.co/300x450/792e39/ffffff?text=Movie+Three"
                alt="Movie Three poster"
            >
            <p class="movie-title">Movie Three</p>
        </div>

    </div>

    <p class="spacing">Enjoy exploring movies!</p>

</body>
</html>
