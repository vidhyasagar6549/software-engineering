

<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Tile</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f3f6;
      padding: 40px;
    }

    .product-card {
      display: block;
      width: 230px;
      padding: 20px;
      background: white;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 2px 8px #ccc;
    }

    .product-image {
      width: 180px;
      height: 180px;
      object-fit: contain;
      display: block;
      margin: 0 auto 15px;
    }

    .product-name {
      display: block;
      font-size: 16px;
      margin-bottom: 10px;
      color: #212121;
    }

    .product-price {
      display: inline-block;
      font-size: 20px;
      font-weight: bold;
      color: #2874f0;
    }


    .hide-price .product-price {
      display: none;
    }
  </style>
</head>

<body>

<!-- /* Note when u havw to hide the price then add hide-price class */ -->
  <div class="product-card " >
    <img class="product-image" src="6572457_sd.avif" alt="Wireless headphones" />

    <span class="product-name">
      Wireless Bluetooth Headphones
    </span>

    <span class="product-price">₹1,499</span>
  </div>



</body>

</html>
