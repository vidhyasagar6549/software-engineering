
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Playlist Bar</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            padding: 30px;
        }

        h2 {
            color: #1DB954;
        }

        /* Horizontal playlist using Flexbox */
        .playlist {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 15px;
            overflow-x: auto;
            padding: 15px;
            background-color: #181818;
            border-radius: 12px;
        }

        /* Individual song card */
        .song-card {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            flex: 0 0 150px;
            min-height: 90px;
            padding: 15px;
            background-color: #282828;
            border-radius: 8px;
            text-align: center;
            box-sizing: border-box;
            transition: background-color 0.3s;
        }

        .song-card:hover {
            background-color: #383838;
        }

        .song-name {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .artist {
            font-size: 13px;
            color: #b3b3b3;
        }
    </style>
</head>

<body>

    <h2>My Playlist</h2>

    <div class="playlist">

        <div class="song-card">
            <div class="song-name">Blinding Lights</div>
            <div class="artist">The Weeknd</div>
        </div>

        <div class="song-card">
            <div class="song-name">Shape of You</div>
            <div class="artist">Ed Sheeran</div>
        </div>

        <div class="song-card">
            <div class="song-name">Levitating</div>
            <div class="artist">Dua Lipa</div>
        </div>

        <div class="song-card">
            <div class="song-name">Perfect</div>
            <div class="artist">Ed Sheeran</div>
        </div>

        <div class="song-card">
            <div class="song-name">Starboy</div>
            <div class="artist">The Weeknd</div>
        </div>

    </div>

</body>
</html>
