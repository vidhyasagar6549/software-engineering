
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social App Icons</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f1f3f6;
            margin: 0;
            padding: 30px;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        /* Flexbox container */
        .container {
            display: flex;
            flex-direction: row;
            justify-content: space-evenly;
            align-items: center;
            background-color: white;
            padding: 25px;
            margin: 30px auto;
            max-width: 700px;
            border-radius: 12px;
            box-shadow: 0 2px 8px #ccc;
        }

        /* Social app icons */
        .container img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            transition: transform 0.3s;
        }

        .container img:hover {
            transform: scale(1.15);
        }
    </style>
</head>

<body>

    <h2>My Favorite Apps</h2>

    <div class="container">
        <img
            src="https://cdn.simpleicons.org/instagram/E4405F"
            alt="Instagram"
            title="Instagram"
        >

        <img
            src="https://cdn.simpleicons.org/whatsapp/25D366"
            alt="WhatsApp"
            title="WhatsApp"
        >

        <img
            src="https://cdn.simpleicons.org/zomato/CB202D"
            alt="Zomato"
            title="Zomato"
        >

        <img
            src="https://cdn.simpleicons.org/spotify/1DB954"
            alt="Spotify"
            title="Spotify"
        >
    </div>

</body>
</html>
