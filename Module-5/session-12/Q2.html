
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Featured Playlists</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            color: white;
        }
        .playlist-card {
            background-color: #181818;
            border-radius: 12px;
            padding: 20px;
            transition: 0.3s;
        }
        .playlist-card:hover {
            background-color: #282828;
            transform: translateY(-5px);
        }
        .playlist-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 8px;
        }
        .btn-listen {
            background-color: #1db954;
            color: #000;
            border-radius: 25px;
            font-weight: bold;
        }
        .btn-listen:hover {
            background-color: #1ed760;
            color: #000;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <h1 class="text-center mb-2">Featured Playlists</h1>
    <p class="text-center text-secondary mb-5">Your music, your mood.</p>

    <div class="row g-4">
        <div class="col-12 col-sm-6 col-lg-4">
            <div class="playlist-card h-100">
                <img src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=600" alt="Electronic music concert">
                <h4 class="mt-3">Party Hits</h4>
                <p class="text-secondary">Energetic tracks to keep you moving.</p>
                <a href="https://open.spotify.com/" target="_blank" class="btn btn-listen px-4">Listen Now</a>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-lg-4">
            <div class="playlist-card h-100">
                <img src="https://images.unsplash.com/photo-1516280440614-37939bbacd81?w=600" alt="Singer performing on stage">
                <h4 class="mt-3">Chill Vibes</h4>
                <p class="text-secondary">Relax and enjoy your favorite melodies.</p>
                <a href="https://open.spotify.com/" target="_blank" class="btn btn-listen px-4">Listen Now</a>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-lg-4">
            <div class="playlist-card h-100">
                <img src="https://images.unsplash.com/photo-1511379938547-c1f69419868d?w=600" alt="Music production studio">
                <h4 class="mt-3">Focus Beats</h4>
                <p class="text-secondary">Instrumental beats for study and work.</p>
                <a href="https://open.spotify.com/" target="_blank" class="btn btn-listen px-4">Listen Now</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
