    
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Product Showcase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f1f3f6;
        }
        .navbar {
            background: #2874f0;
        }
        .product-card {
            border: none;
            border-radius: 8px;
            transition: 0.3s;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 18px rgba(0,0,0,0.12);
        }
        .product-img {
            height: 180px;
            width: 100%;
            object-fit: contain;
            padding: 15px;
        }
        .price {
            color: #212529;
            font-size: 20px;
            font-weight: bold;
        }
        .buy-btn {
            background: #fb641b;
            color: white;
            border: none;
        }
        .buy-btn:hover {
            background: #e85b18;
            color: white;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark py-3">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">Flipkart</a>
        <span class="text-white">Explore Products</span>
    </div>
</nav>

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">Top Deals</h2>
        <a href="#" class="btn btn-primary">View All</a>
    </div>

    <div class="row g-3">
        <div class="col-6 col-md-3">
            <div class="card product-card h-100">
                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500" class="card-img-top product-img" alt="Wireless headphones">
                <div class="card-body">
                    <h6 class="card-title">Wireless Headphones</h6>
                    <p class="text-success mb-2">Special Offer</p>
                    <p class="price mb-2">₹1,499</p>
                    <p class="text-secondary small">40% off</p>
                    <button class="btn buy-btn w-100">Buy Now</button>
                </div>
            </div>
        </div>

        <div class="col-6 col-md-3">
            <div class="card product-card h-100">
                <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500" class="card-img-top product-img" alt="Smart watch">
                <div class="card-body">
                    <h6 class="card-title">Smart Watch</h6>
                    <p class="text-success mb-2">Special Offer</p>
                    <p class="price mb-2">₹2,499</p>
                    <p class="text-secondary small">30% off</p>
                    <button class="btn buy-btn w-100">Buy Now</button>
                </div>
            </div>
        </div>

        <div class="col-6 col-md-3">
            <div class="card product-card h-100">
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500" class="card-img-top product-img" alt="Red sports shoes">
                <div class="card-body">
                    <h6 class="card-title">Sports Shoes</h6>
                    <p class="text-success mb-2">Special Offer</p>
                    <p class="price mb-2">₹1,999</p>
                    <p class="text-secondary small">35% off</p>
                    <button class="btn buy-btn w-100">Buy Now</button>
                </div>
            </div>
        </div>

        <div class="col-6 col-md-3">
            <div class="card product-card h-100">
                <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=500" class="card-img-top product-img" alt="Digital camera">
                <div class="card-body">
                    <h6 class="card-title">Digital Camera</h6>
                    <p class="text-success mb-2">Special Offer</p>
                    <p class="price mb-2">₹8,999</p>
                    <p class="text-secondary small">20% off</p>
                    <button class="btn buy-btn w-100">Buy Now</button>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
