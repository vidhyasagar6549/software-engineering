
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Links Preview</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f1f4f9;
            font-family: Arial, sans-serif;
        }
        .music-form {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }
        .preview-card {
            border: none;
            border-radius: 14px;
            height: 100%;
            transition: 0.3s;
        }
        .preview-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        }
        .music-icon {
            font-size: 35px;
        }
        .spotify {
            color: #1db954;
        }
        .youtube {
            color: #ff0033;
        }
        .apple {
            color: #fa243c;
        }
        .preview-link {
            overflow-wrap: anywhere;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="text-center mb-4">
                <h1 class="fw-bold">My Music Links</h1>
                <p class="text-secondary">Add your favorite music profile links.</p>
            </div>

            <form id="musicLinksForm" class="music-form">
                <div class="mb-3">
                    <label for="spotify" class="form-label fw-semibold">Spotify Profile URL</label>
                    <input type="url" class="form-control" id="spotify" placeholder="https://open.spotify.com/..." pattern="https://(open\.)?spotify\.com/.*" title="Enter a Spotify URL">
                </div>

                <div class="mb-3">
                    <label for="youtube" class="form-label fw-semibold">YouTube Music URL</label>
                    <input type="url" class="form-control" id="youtube" placeholder="https://music.youtube.com/..." pattern="https://music\.youtube\.com/.*" title="Enter a YouTube Music URL">
                </div>

                <div class="mb-4">
                    <label for="apple" class="form-label fw-semibold">Apple Music URL</label>
                    <input type="url" class="form-control" id="apple" placeholder="https://music.apple.com/..." pattern="https://music\.apple\.com/.*" title="Enter an Apple Music URL">
                </div>

                <button type="submit" class="btn btn-dark w-100 py-2">Show Preview Cards</button>
                <p id="message" class="text-danger mt-3 mb-0" role="alert"></p>
            </form>
        </div>
    </div>

    <div class="mt-5">
        <h2 class="fw-bold mb-4">Your Music Platforms</h2>
        <div class="row g-4" id="previewContainer"></div>
    </div>
</div>

<script>
    const form = document.getElementById("musicLinksForm");
    const previewContainer = document.getElementById("previewContainer");
    const message = document.getElementById("message");

    const platforms = [
        {
            id: "spotify",
            name: "Spotify",
            icon: "♫",
            className: "spotify",
            background: "#e7f8ed"
        },
        {
            id: "youtube",
            name: "YouTube Music",
            icon: "▶",
            className: "youtube",
            background: "#fff0f1"
        },
        {
            id: "apple",
            name: "Apple Music",
            icon: "♪",
            className: "apple",
            background: "#fff0f2"
        }
    ];

    form.addEventListener("submit", function(event) {
        event.preventDefault();
        message.textContent = "";

        const submittedLinks = platforms
            .map(platform => ({
                ...platform,
                url: document.getElementById(platform.id).value.trim()
            }))
            .filter(platform => platform.url);

        if (submittedLinks.length === 0) {
            message.textContent = "Please enter at least one music URL.";
            return;
        }

        previewContainer.replaceChildren();

        submittedLinks.forEach(platform => {
            const column = document.createElement("div");
            column.className = "col-12 col-md-6 col-lg-4";

            const card = document.createElement("div");
            card.className = "card preview-card shadow-sm";

            const body = document.createElement("div");
            body.className = "card-body p-4";

            const icon = document.createElement("div");
            icon.className = `music-icon ${platform.className} mb-3`;
            icon.textContent = platform.icon;

            const title = document.createElement("h5");
            title.className = "card-title fw-bold";
            title.textContent = platform.name;

            const description = document.createElement("p");
            description.className = "text-secondary small";
            description.textContent = "Your music link";

            const link = document.createElement("a");
            link.className = "preview-link d-block mb-3";
            link.href = platform.url;
            link.textContent = platform.url;
            link.target = "_blank";
            link.rel = "noopener noreferrer";

            const button = document.createElement("a");
            button.className = "btn btn-dark w-100";
            button.href = platform.url;
            button.target = "_blank";
            button.rel = "noopener noreferrer";
            button.textContent = "Open Platform";

            body.append(icon, title, description, link, button);
            card.append(body);
            column.append(card);
            previewContainer.append(column);
        });
    });
</script>

</body>
</html>
