
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Link Preview</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            padding: 30px 15px;
            color: #1e293b;
        }

        .container {
            max-width: 650px;
            margin: auto;
        }

        h1, h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .form-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #00000010;
        }

        .input-group {
            position: relative;
            margin-bottom: 15px;
        }

        .input-group i {
            position: absolute;
            top: 50%;
            left: 15px;
            transform: translateY(-50%);
            font-size: 20px;
        }

        input {
            width: 100%;
            padding: 14px 15px 14px 48px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #bfdbfe;
            border-color: #2563eb;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #1d4ed8;
        }

        #preview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 15px;
            margin-top: 25px;
        }

        .social-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            border-left: 5px solid;
            box-shadow: 0 4px 12px #0000000d;
            overflow-wrap: anywhere;
        }

        .social-card .logo {
            font-size: 30px;
            margin-bottom: 12px;
        }

        .social-card h3 {
            margin-bottom: 8px;
        }

        .social-card p {
            color: #64748b;
            margin-bottom: 15px;
        }

        .social-card a {
            display: inline-block;
            padding: 9px 18px;
            border-radius: 6px;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .instagram {
            border-color: #e1306c;
        }

        .instagram .logo {
            color: #e1306c;
        }

        .instagram a {
            background: #e1306c;
        }

        .linkedin {
            border-color: #0a66c2;
        }

        .linkedin .logo {
            color: #0a66c2;
        }

        .linkedin a {
            background: #0a66c2;
        }

        .github {
            border-color: #24292f;
        }

        .github .logo {
            color: #24292f;
        }

        .github a {
            background: #24292f;
        }

        .youtube {
            border-color: #ff0000;
        }

        .youtube .logo {
            color: #ff0000;
        }

        .youtube a {
            background: #ff0000;
        }

        .facebook {
            border-color: #1877f2;
        }

        .facebook .logo {
            color: #1877f2;
        }

        .facebook a {
            background: #1877f2;
        }

        .message {
            text-align: center;
            color: #64748b;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>My Social Links</h1>

    <div class="form-box">
        <form id="socialForm">
            <div class="input-group">
                <i class="fa-brands fa-instagram" style="color:#e1306c"></i>
                <input type="url" id="socialUrl" placeholder="Enter social profile URL" required>
            </div>

            <button type="submit" class="submit-btn">Add Social Link</button>
        </form>
    </div>

    <h2 style="margin-top:30px">Profile Previews</h2>
    <div id="preview"></div>
    <p id="message" class="message">Your added profiles will appear here.</p>
</div>

<script>
    const form = document.getElementById("socialForm");
    const input = document.getElementById("socialUrl");
    const preview = document.getElementById("preview");
    const message = document.getElementById("message");

    const platforms = [
        {
            name: "Instagram",
            domain: "instagram.com",
            className: "instagram",
            icon: "fa-instagram"
        },
        {
            name: "LinkedIn",
            domain: "linkedin.com",
            className: "linkedin",
            icon: "fa-linkedin"
        },
        {
            name: "GitHub",
            domain: "github.com",
            className: "github",
            icon: "fa-github"
        },
        {
            name: "YouTube",
            domain: "youtube.com",
            className: "youtube",
            icon: "fa-youtube"
        },
        {
            name: "Facebook",
            domain: "facebook.com",
            className: "facebook",
            icon: "fa-facebook"
        }
    ];

    form.addEventListener("submit", function(event) {
        event.preventDefault();

        let url;

        try {
            url = new URL(input.value.trim());
        } catch {
            alert("Please enter a valid social profile URL.");
            return;
        }

        if (url.protocol !== "https:" && url.protocol !== "http:") {
            alert("Please enter an HTTP or HTTPS URL.");
            return;
        }

        const platform = platforms.find(function(item) {
            return url.hostname.toLowerCase().replace(/^www\./, "") === item.domain ||
                   url.hostname.toLowerCase().endsWith("." + item.domain);
        });

        if (!platform) {
            alert("Please enter an Instagram, LinkedIn, GitHub, YouTube, or Facebook URL.");
            return;
        }

        let username = url.pathname.split("/").filter(Boolean)[0] || "Profile";

        if (platform.name === "YouTube" && username.startsWith("@")) {
            username = username;
        } else if (platform.name === "YouTube" && ["channel", "c", "user"].includes(username)) {
            username = url.pathname.split("/").filter(Boolean)[1] || "YouTube Channel";
        } else if (platform.name === "LinkedIn" && ["in", "company", "school"].includes(username)) {
            username = url.pathname.split("/").filter(Boolean)[1] || "LinkedIn Profile";
        }

        const card = document.createElement("div");
        card.className = "social-card " + platform.className;

        const logo = document.createElement("div");
        logo.className = "logo";

        const icon = document.createElement("i");
        icon.className = "fa-brands " + platform.icon;
        logo.appendChild(icon);

        const title = document.createElement("h3");
        title.textContent = platform.name;

        const handle = document.createElement("p");
        handle.textContent = "@" + username;

        const visit = document.createElement("a");
        visit.href = url.href;
        visit.target = "_blank";
        visit.rel = "noopener noreferrer";
        visit.textContent = "Visit";

        card.append(logo, title, handle, visit);
        preview.prepend(card);

        message.textContent = "Your social profile has been added!";
        input.value = "";
    });
</script>

</body>
</html>
