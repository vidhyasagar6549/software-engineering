<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Product Card</title>
  <link rel="stylesheet" href="Q1-TO-5.css">
</head>
<body>

  <h2 class="heading">Featured Product</h2>

  <div class="product-card">
    <div class="product-image">
      <img
        src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500"
        alt="Wireless headphones">
    </div>

    <div class="product-details">
      <h2>Premium Wireless Headphones</h2>
      <p class="description">
        Enjoy crystal-clear sound, deep bass, comfortable ear cushions,
        and long-lasting battery life.
      </p>

      <div class="rating">★ 4.5 | 2,340 Ratings</div>

      <div class="price">
        ₹1,499 <span>₹2,999</span>
        <strong>50% off</strong>
      </div>

      <p class="delivery">Free delivery</p>

      <button>Add to Cart</button>
    </div>
  </div>

</body>
</html>
