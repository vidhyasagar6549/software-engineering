
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Featured Movies</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f2f2f2;
        }

        .carousel {
            max-width: 900px;
            margin: auto;
            background: #111;
            border-radius: 12px;
            overflow: hidden;
        }

        .carousel img {
            width: 100%;
            height: 500px;
            object-fit: contain;
            background: #111;
        }

        .carousel-caption {
            background: rgba(0, 0, 0, 0.8);
            border-radius: 10px;
            padding: 12px;
            bottom: 25px;
        }

        .carousel-caption h5 {
            color: #ffc107;
            font-weight: bold;
        }

        h2 {
            font-weight: bold;
        }

        @media (max-width: 576px) {
            .carousel img {
                height: 350px;
            }

            .carousel-caption {
                bottom: 10px;
                padding: 6px;
            }
        }
    </style>
</head>
<body>

<div class="container py-5">

    <h2 class="text-center mb-4">🎬 Featured Movies</h2>

    <div id="movieCarousel" class="carousel slide"
         data-bs-ride="carousel">

        <!-- Indicators -->
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#movieCarousel"
                    data-bs-slide-to="0" class="active"
                    aria-label="Inception"></button>

            <button type="button" data-bs-target="#movieCarousel"
                    data-bs-slide-to="1"
                    aria-label="Interstellar"></button>

            <button type="button" data-bs-target="#movieCarousel"
                    data-bs-slide-to="2"
                    aria-label="The Dark Knight"></button>
        </div>

        <!-- Movie Slides -->
        <div class="carousel-inner">

            <!-- Movie 1 -->
            <div class="carousel-item active">
                <img
                    src="https://image.tmdb.org/t/p/w780/oYuLEt3zVCKq57qu2F8dT7NIa6f.jpg"
                    class="d-block w-100"
                    alt="Inception movie poster">

                <div class="carousel-caption">
                    <h5>Inception (2010)</h5>
                    <p>Your mind is the scene of the crime.</p>
                </div>
            </div>

            <!-- Movie 2 -->
            <div class="carousel-item">
                <img
                    src="https://image.tmdb.org/t/p/w780/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg"
                    class="d-block w-100"
                    alt="Interstellar movie poster">

                <div class="carousel-caption">
                    <h5>Interstellar (2014)</h5>
                    <p>Mankind was born on Earth. It was never meant to die here.</p>
                </div>
            </div>

            <!-- Movie 3 -->
            <div class="carousel-item">
                <img
                    src="https://image.tmdb.org/t/p/w780/qJ2tW6WMUDux911r6m7haRef0WH.jpg"
                    class="d-block w-100"
                    alt="The Dark Knight movie poster">

                <div class="carousel-caption">
                    <h5>The Dark Knight (2008)</h5>
                    <p>Why so serious?</p>
                </div>
            </div>

        </div>

        <!-- Previous Button -->
        <button class="carousel-control-prev" type="button"
                data-bs-target="#movieCarousel"
                data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
            <span class="visually-hidden">Previous</span>
        </button>

        <!-- Next Button -->
        <button class="carousel-control-next" type="button"
                data-bs-target="#movieCarousel"
                data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
            <span class="visually-hidden">Next</span>
        </button>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
