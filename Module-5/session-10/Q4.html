
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Review - Zomato Style</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f8f8;
            font-family: Arial, sans-serif;
        }

        .review-card {
            max-width: 500px;
            margin: 60px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .zomato-title {
            color: #e23744;
            font-size: 32px;
            font-weight: bold;
        }

        .star-rating {
            display: flex;
            flex-direction: row-reverse;
            justify-content: flex-end;
            gap: 5px;
        }

        .star-rating input {
            display: none;
        }

        .star-rating label {
            font-size: 35px;
            color: #ddd;
            cursor: pointer;
        }

        .star-rating label:hover,
        .star-rating label:hover ~ label,
        .star-rating input:checked ~ label {
            color: #ffc107;
        }

        .btn-zomato {
            background-color: #e23744;
            color: white;
            border: none;
        }

        .btn-zomato:hover {
            background-color: #c82333;
            color: white;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="review-card">

            <div class="text-center mb-4">
                <h1 class="zomato-title">zomato</h1>
                <h4>Write a Restaurant Review</h4>
                <p class="text-muted">Share your dining experience!</p>
            </div>

            <form action="#" method="post">

                <!-- Name -->
                <div class="mb-3">
                    <label for="name" class="form-label">
                        Your Name
                    </label>
                    <input
                        type="text"
                        class="form-control"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        required
                    >
                </div>

                <!-- Star Rating -->
                <div class="mb-3">
                    <label class="form-label d-block">
                        Rate Your Experience
                    </label>

                    <div class="star-rating">
                        <input type="radio" id="star5"
                               name="rating" value="5" required>
                        <label for="star5" title="5 stars">&#9733;</label>

                        <input type="radio" id="star4"
                               name="rating" value="4">
                        <label for="star4" title="4 stars">&#9733;</label>

                        <input type="radio" id="star3"
                               name="rating" value="3">
                        <label for="star3" title="3 stars">&#9733;</label>

                        <input type="radio" id="star2"
                               name="rating" value="2">
                        <label for="star2" title="2 stars">&#9733;</label>

                        <input type="radio" id="star1"
                               name="rating" value="1">
                        <label for="star1" title="1 star">&#9733;</label>
                    </div>
                </div>

                <!-- Review Message -->
                <div class="mb-4">
                    <label for="review" class="form-label">
                        Your Review
                    </label>
                    <textarea
                        class="form-control"
                        id="review"
                        name="review"
                        rows="4"
                        placeholder="Tell us about the food, service, and ambience..."
                        required
                    ></textarea>
                </div>

                <!-- Submit Button -->
                <button type="submit"
                        class="btn btn-zomato w-100 py-2">
                    Submit Review
                </button>

            </form>

        </div>
    </div>

</body>
</html>
