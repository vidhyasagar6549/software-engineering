<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Product Cards</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container my-5">
    <h2 class="text-center mb-4">Featured Products</h2>

    <div class="row">
        <div class="col-md-4 mb-3">
            <div class="card h-100">
                <img src="OIP.webp"
                     class="card-img-top" alt="Laptop">
                <div class="card-body">
                    <h5 class="card-title">Laptop</h5>
                    <p class="card-text">Powerful laptop for work and study.</p>
                    <h5 class="text-success">₹45,000</h5>
                    <a href="#" class="btn btn-primary">Buy Now</a>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-3">
            <div class="card h-100">
                <img src="../session-7/download.webp"
                     class="card-img-top" alt="Mobile">
                <div class="card-body">
                    <h5 class="card-title">Smartphone</h5>
                    <p class="card-text">A stylish smartphone with great features.</p>
                    <h5 class="text-success">₹18,000</h5>
                    <a href="#" class="btn btn-primary">Buy Now</a>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-3">
            <div class="card h-100">
                <img src="../session-6/6572457_sd.avif"
                     class="card-img-top" alt="Headphones">
                <div class="card-body">
                    <h5 class="card-title">Headphones</h5>
                    <p class="card-text">Enjoy music with clear, rich sound.</p>
                    <h5 class="text-success">₹2,000</h5>
                    <a href="#" class="btn btn-primary">Buy Now</a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
