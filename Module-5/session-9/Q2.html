<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Restaurant Listing</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container my-5">
    <h2 class="text-center text-danger mb-4">
        Popular Restaurants
    </h2>

    <div class="row">
        <div class="col-md-6 mb-3">
            <div class="card h-100 shadow-sm">
                <img src="https://placehold.co/600x250?text=Pizza+Palace"
                     class="card-img-top" alt="Pizza Palace">
                <div class="card-body">
                    <h5 class="card-title">Pizza Palace</h5>
                    <p class="card-text">
                        Delicious pizzas, pasta, and Italian dishes.
                    </p>
                    <span class="badge bg-success">4.5 ★</span>
                </div>
            </div>
        </div>

        <div class="col-md-6 mb-3">
            <div class="card h-100 shadow-sm">
                <img src="https://placehold.co/600x250?text=Spice+Garden"
                     class="card-img-top" alt="Spice Garden">
                <div class="card-body">
                    <h5 class="card-title">Spice Garden</h5>
                    <p class="card-text">
                        Enjoy authentic Indian food and flavorful curries.
                    </p>
                    <span class="badge bg-success">4.2 ★</span>
                </div>
            </div>
        </div>

        <div class="col-md-6 mb-3">
            <div class="card h-100 shadow-sm">
                <img src="https://placehold.co/600x250?text=Burger+Hub"
                     class="card-img-top" alt="Burger Hub">
                <div class="card-body">
                    <h5 class="card-title">Burger Hub</h5>
                    <p class="card-text">
                        Fresh burgers, fries, and refreshing beverages.
                    </p>
                    <span class="badge bg-success">4.3 ★</span>
                </div>
            </div>
        </div>

        <div class="col-md-6 mb-3">
            <div class="card h-100 shadow-sm">
                <img src="https://placehold.co/600x250?text=Sweet+Treats"
                     class="card-img-top" alt="Sweet Treats">
                <div class="card-body">
                    <h5 class="card-title">Sweet Treats</h5>
                    <p class="card-text">
                        Cakes, ice cream, desserts, and sweet dishes.
                    </p>
                    <span class="badge bg-success">4.6 ★</span>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
