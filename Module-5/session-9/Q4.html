<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Responsive Layout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container my-5">
    <h2 class="text-center mb-4">Responsive Two-Column Layout</h2>

    <div class="row">
        <div class="col-12 col-md-6 mb-3">
            <div class="p-4 bg-primary text-white rounded">
                <h3>Column 1</h3>
                <p>
                    This is the first column. It occupies the full
                    width on small screens and half the width on
                    medium and larger screens.
                </p>
            </div>
        </div>

        <div class="col-12 col-md-6 mb-3">
            <div class="p-4 bg-success text-white rounded">
                <h3>Column 2</h3>
                <p>
                    This is the second column. It stacks below
                    Column 1 on small screens and sits beside it
                    on medium and larger screens.
                </p>
            </div>
        </div>
    </div>
</div>

</body>
</html>
