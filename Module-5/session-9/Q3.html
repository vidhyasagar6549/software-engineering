<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Movie Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">

<div class="container my-5">
    <h2 class="text-center text-danger mb-4">Now Showing</h2>

    <div class="row align-items-center">
        <div class="col-md-4 mb-3">
            <img src="https://placehold.co/400x550?text=Movie+Poster"
                 class="img-fluid rounded"
                 alt="Movie Poster">
        </div>

        <div class="col-md-8">
            <h2>Avengers: Endgame</h2>

            <p><strong>Genre:</strong> Action, Adventure, Sci-Fi</p>

            <p><strong>Rating:</strong>
                <span class="badge bg-warning text-dark">8.4/10</span>
            </p>

            <p><strong>Duration:</strong> 3 hours 1 minute</p>

            <p>
                Earth's heroes unite for an epic battle to restore
                balance and save the universe.
            </p>

            <a href="#" class="btn btn-danger btn-lg">Book Now</a>
        </div>
    </div>
</div>

</body>
</html>
