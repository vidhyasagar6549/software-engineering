<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="page-wrapper">
        <section class="form-card">
            <div class="form-header">
                <span class="eyebrow">WELCOME TO OUR INSTITUTE</span>
                <h1>Student Registration</h1>
                <p>Fill in your details to complete your registration.</p>
            </div>

            <form id="registrationForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="fullName">Full Name <span>*</span></label>
                        <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address <span>*</span></label>
                        <input type="email" id="email" name="email" placeholder="you@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="mobile">Mobile Number <span>*</span></label>
                        <input type="tel" id="mobile" name="mobile" placeholder="10-digit mobile number" pattern="[0-9]{10}" maxlength="10" required>
                    </div>

                    <div class="form-group">
                        <label for="dob">Date of Birth <span>*</span></label>
                        <input type="date" id="dob" name="dob" required>
                    </div>

                    <div class="form-group">
                        <label for="gender">Gender <span>*</span></label>
                        <select id="gender" name="gender" required>
                            <option value="">Select gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                            <option value="Prefer not to say">Prefer not to say</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="course">Select Course <span>*</span></label>
                        <select id="course" name="course" required>
                            <option value="">Choose your course</option>
                            <option value="Web Development">Web Development</option>
                            <option value="Python Programming">Python Programming</option>
                            <option value="Java Development">Java Development</option>
                            <option value="Data Science">Data Science</option>
                            <option value="UI/UX Design">UI/UX Design</option>
                        </select>
                    </div>

                    <div class="form-group full-width">
                        <label for="address">Address <span>*</span></label>
                        <textarea id="address" name="address" rows="3" placeholder="Enter your full address" required></textarea>
                    </div>
                </div>

                <label class="terms">
                    <input type="checkbox" id="terms" required>
                    <span>I confirm that the information provided is correct.</span>
                </label>

                <button type="submit" class="submit-btn">Submit Registration <span aria-hidden="true">→</span></button>
                <p id="successMessage" class="success-message" role="status" aria-live="polite"></p>
            </form>
        </section>
        <p class="page-note">Please check your details before submitting the form.</p>
    </main>
</body>
</html>
